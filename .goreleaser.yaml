# GoReleaser configuration for tesla-sentry-viewer
# https://goreleaser.com

version: 2

# Project metadata
project_name: tesla-sentry-viewer

# Build configuration
builds:
  - id: tesla-sentry-viewer
    main: ./cmd/server
    binary: tesla-sentry-viewer
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X 'main.BuildDate={{.Date}}'
      - -X 'main.GitCommit={{.Commit}}'
    mod_timestamp: '{{ .CommitTimestamp }}'

# Archives configuration
archives:
  - id: tesla-sentry-viewer
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - README.md
      - config.example.yaml

# Release configuration
release:
  github:
    owner: denysvitali
    name: tesla-sentry-viewer